; ThrottleStop 9.7.3+ Key Settings Reference for Intel Core i7-13700HX (HP OMEN 17 8BAD)
; Do NOT blindly overwrite your full ThrottleStop.ini with this snippet — merge these
; settings into your existing ThrottleStop.ini or set them via TPL & FIVR in the GUI.
; (Scripts in ../scripts/ modify only OneAD_*, UsePerCore, and PerCore* safely.)

; --- Profile 0 = Performance ---
Profile=0
SpeedShift=1
SpeedShiftMaxMin0=0x3D01
EnPerfPref0=128

; --- 150 W PL1 / PL2 Power Limits + MMIO Sync ---
SyncMMIO=0x1
LockPowerLimits=0
PowerLimitEAX0=0x00FE84B0
PowerLimitEDX0=0x004284B0
PowerLimit4=0x00000640
NoSetPL=0x0

; --- Ring/Cache Ratio (8x min, 48x max = 4.8 GHz) ---
CacheMinMax0=0x830

; --- P-Core Turbo Groups (MSR 0x1AD) ---
; 1-2 active P-cores = 51x (0x33) or 52x (0x34), 3-8 active P-cores = 50x (0x32)
OneAD_EAX0=0x32323333
OneAD_EDX0=0x32323232
OneAE_EAX0=0x04030201
OneAE_EDX0=0x08070605

; --- Per-Core Ratio Override (ThrottleStop 9.7.3+) ---
; Favor the two best cores (Core 4* & Core 6* on tested unit; verify yours via HWiNFO/XTU)
UsePerCore=1
PerCore0=50
PerCore1=50
PerCore2=50
PerCore3=50
PerCore4=51
PerCore5=50
PerCore6=51
PerCore7=50
; PerCore8 = E-Core ratio limit (stock 37x)
PerCore8=37

; --- Conservative Daily Undervolt (-44.9 mV Core & P-Cache) ---
; Note: Light-load 51x/52x OC is much more stable at ~ -45 mV than -90/-110 mV.
; Requires Windows VBS/Hyper-V OFF for MSR 0x150 write access!
UnlockVoltage00=1
FIVRVoltage00=0xFA400000
UnlockVoltage20=1
FIVRVoltage20=0xFA400000
